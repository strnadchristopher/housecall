# Standalone image install. Requires Docker Compose v2.24+ (inline configs).
# No VM profile; use compose.yaml + compose.vm-media.yaml for the optional VM.
name: housecall-easy
services:
  data-init:
    image: ${HOUSECALL_IMAGE:-ghcr.io/strnadchristopher/housecall:0.4.0}
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - chown 10001:10001 /data && chmod 0700 /data
    volumes:
    - app-data:/data
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    security_opt:
    - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 16
  app:
    depends_on:
      scanner:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    ports:
    - ${SFU_HOST_BIND:-0.0.0.0}:${SFU_PORT:-50000}:${SFU_PORT:-50000}/udp
    environment:
      HOUSECALL_BIND: 0.0.0.0:3000
      HOUSECALL_DATABASE: /data/housecall.sqlite
      HOUSECALL_STATIC_DIR: /app/client
      HOUSECALL_SETUP_TOKEN: ${HOUSECALL_SETUP_TOKEN:-}
      HOUSECALL_ORIGIN: ${HOUSECALL_ORIGIN:?Set HOUSECALL_ORIGIN in .env, for example https://chat.example.com}
      HOUSECALL_PUBLIC_URL: ${HOUSECALL_PUBLIC_URL:?Set HOUSECALL_PUBLIC_URL in .env, for example https://chat.example.com}
      HOUSECALL_MAIL_FROM: ${HOUSECALL_MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      HOUSECALL_MEDIA_DIR: /data/media
      HOUSECALL_MEDIA_KEY: ${HOUSECALL_MEDIA_KEY:?Set a random 32-byte hex media encryption key in .env}
      HOUSECALL_CLAMD_SOCKET: /scan/clamd.sock
      HOUSECALL_MEDIA_TOTAL_BYTES: ${HOUSECALL_MEDIA_TOTAL_BYTES:-21474836480}
      HOUSECALL_MEDIA_OWNER_BYTES: ${HOUSECALL_MEDIA_OWNER_BYTES:-4294967296}
      HOUSECALL_MEDIA_UPLOAD_BYTES: ${HOUSECALL_MEDIA_UPLOAD_BYTES:-2147483648}
      HOUSECALL_MEDIA_PENDING_PER_OWNER: ${HOUSECALL_MEDIA_PENDING_PER_OWNER:-16}
      HOUSECALL_MEDIA_MAX_UPLOADS: ${HOUSECALL_MEDIA_MAX_UPLOADS:-10000}
      HOUSECALL_MEDIA_SCANNER: ${HOUSECALL_MEDIA_SCANNER:-clamav}
      HOUSECALL_FSANALYZE: ${HOUSECALL_FSANALYZE:-}
      HOUSECALL_SCAN_TIMEOUT_SECONDS: ${HOUSECALL_SCAN_TIMEOUT_SECONDS:-300}
      SFU_BIND: 0.0.0.0:${SFU_PORT:-50000}
      SFU_PUBLIC_IP: ${SFU_PUBLIC_IP:-127.0.0.1}
      HOUSECALL_CLIENT_ORIGINS: ${HOUSECALL_CLIENT_ORIGINS:-tauri://localhost,http://tauri.localhost}
      HOUSECALL_LINK_REQUEST: ${HOUSECALL_LINK_REQUEST:-0}
      HOUSECALL_ANDROID_PASSKEY_ORIGINS: ${HOUSECALL_ANDROID_PASSKEY_ORIGINS:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      GIMME_BASE_URL: ${GIMME_BASE_URL:-}
      GIMME_AGENT_API_KEY: ${GIMME_AGENT_API_KEY:-}
      GIMME_DRY_RUN: ${GIMME_DRY_RUN:-true}
      SWITCHBOARD_URL: ${SWITCHBOARD_URL:-}
      SWITCHBOARD_API_KEY: ${SWITCHBOARD_API_KEY:-}
      DJ_ENABLED: ${DJ_ENABLED:-false}
      DJ_TMPFS_DIR: /tmp/housecall-dj
      SPOTIFY_ACCESS_TOKEN: ${SPOTIFY_ACCESS_TOKEN:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_TOKEN_KEY: ${PUSH_TOKEN_KEY:-}
      APNS_PRIVATE_KEY_PEM: ${APNS_PRIVATE_KEY_PEM:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    volumes:
    - app-data:/data
    - scan-socket:/scan:ro
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 1g
    pids_limit: 128
    image: ${HOUSECALL_IMAGE:-ghcr.io/strnadchristopher/housecall:0.4.0}
  scanner-init:
    image: clamav/clamav:1.4
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - chown 100:101 /scan && chmod 0755 /scan
    volumes:
    - scan-socket:/scan
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    security_opt:
    - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 16
  scanner:
    depends_on:
      scanner-init:
        condition: service_completed_successfully
    image: clamav/clamav:1.4
    healthcheck:
      test:
      - CMD
      - clamdscan
      - --ping
      - '1'
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 6
    volumes:
    - scan-socket:/run/clamav
    - scanner-db:/var/lib/clamav
    tmpfs:
    - /tmp:size=2304m,mode=1777
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 128
    configs:
    - source: clamd
      target: /etc/clamav/clamd.conf
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
    - ${HOUSECALL_HTTPS_BIND:-0.0.0.0}:80:80
    - ${HOUSECALL_HTTPS_BIND:-0.0.0.0}:443:443
    configs:
    - source: caddy
      target: /etc/caddy/Caddyfile
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    security_opt:
    - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
configs:
  clamd:
    content: |
      Foreground yes
      LocalSocket /run/clamav/clamd.sock
      LocalSocketMode 666
      FixStaleSocket yes
      User clamav
      DatabaseDirectory /var/lib/clamav
      LogTime yes
      MaxThreads 1
      MaxQueue 2
      TemporaryDirectory /tmp
      StreamMaxLength 2048M
      MaxFileSize 2048M
      MaxScanSize 4096M
      AlertExceedsMax yes
  caddy:
    content: |
      ${HOUSECALL_DOMAIN:?Set the DNS hostname} {
          reverse_proxy app:3000
      }

volumes:
  app-data: {}
  scan-socket: {}
  scanner-db: {}
  caddy-data: {}
  caddy-config: {}
