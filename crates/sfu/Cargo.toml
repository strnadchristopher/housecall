[package]
name = "chriscord-sfu"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
str0m = { version = "0.25", default-features = false, features = ["openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
