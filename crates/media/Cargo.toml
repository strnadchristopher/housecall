[package]
name = "chriscord-media"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
