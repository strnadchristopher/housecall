[package]
name = "housecall-client"
version = "0.3.0"
description = "Private Housecall client"
edition = "2021"
publish = false
[lib]
name = "housecall_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-callkit = { path = "plugins/tauri-plugin-callkit" }
tauri-plugin-secure-session = { path = "plugins/tauri-plugin-secure-session" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Exact upstream safety backport; see ../../patches/README.md.
[patch.crates-io]
glib = { path = "../../patches/glib" }
glib-macros = { path = "../../patches/glib-macros" }
gtk3-macros = { path = "../../patches/gtk3-macros" }
