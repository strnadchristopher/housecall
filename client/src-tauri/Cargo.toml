[package]
name = "chriscord-client"
version = "0.1.0"
description = "Private Chriscord client"
edition = "2021"
publish = false
[lib]
name = "chriscord_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# Exact upstream safety backport; see ../../patches/README.md.
[patch.crates-io]
glib = { path = "../../patches/glib" }
glib-macros = { path = "../../patches/glib-macros" }
gtk3-macros = { path = "../../patches/gtk3-macros" }
