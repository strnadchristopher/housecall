[package]
name = "tauri-plugin-secure-session"
version = "0.1.0"
description = "Keeps the Housecall session in OS secure storage: iOS Keychain, Android Keystore, desktop keyring."
edition = "2021"
publish = false
links = "tauri-plugin-secure-session"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# One OS credential store per desktop platform. If it is unavailable at run time
# (for example no Secret Service on Linux) every call fails and the app stays memory-only.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
