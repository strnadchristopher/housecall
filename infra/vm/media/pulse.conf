daemonize = no
allow-module-loading = no
allow-exit = no
use-pid-file = no
enable-shm = no
enable-memfd = no
exit-idle-time = -1
flat-volumes = no
default-sample-format = s16le
default-sample-rate = 48000
alternate-sample-rate = 48000
default-sample-channels = 2
default-fragments = 4
default-fragment-size-msec = 10
