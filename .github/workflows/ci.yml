name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-public-safe.sh
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pkg-config libssl-dev
      - run: bash scripts/test-server.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit && cargo deny check
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix client
      - run: npm run build --prefix client && npm test --prefix client
      - run: cargo build --locked
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd client && npx playwright install --with-deps chromium && npm run e2e && npm run test:voice && node tests/run-plex.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            evidence/
            client/test-results/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix client
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path patches/glib/Cargo.toml --release --test housecall_variant_regression
      - run: cd client && npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: client/src-tauri/target/release/housecall*

  android:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci --prefix client
      - run: cd client && npx tauri android build --target aarch64 --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
