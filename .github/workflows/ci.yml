name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pkg-config libssl-dev
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo test --locked --manifest-path crates/media/Cargo.toml
      - run: cargo test --locked --manifest-path crates/activities/Cargo.toml
      - run: cargo test --locked --manifest-path crates/sfu/Cargo.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit && cargo deny check
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix client
      - run: npm run build --prefix client && npm test --prefix client
      - run: cargo build --locked
      - run: cd client && npx playwright install --with-deps chromium && npm run e2e && npm run test:voice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: evidence/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix client
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path patches/glib/Cargo.toml --release --test chriscord_variant_regression
      - run: cd client && npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: client/src-tauri/target/release/chriscord*
