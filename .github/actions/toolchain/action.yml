name: toolchain
description: >
  Node 22 + Rust stable. On GitHub-hosted runners installs them; on Council self-hosted runners
  (preinstalled toolchains) only points CARGO_TARGET_DIR at the persistent per-job cache.
inputs:
  hosted: { description: "'true' on GitHub-hosted runners", default: "false" }
  rust-targets: { description: "extra rustup targets", default: "" }
  rust-components: { description: "extra rustup components", default: "" }
  linux-gui: { description: "install Tauri Linux deps (hosted only)", default: "false" }
  cache-key: { description: "persistent target-dir name on self-hosted runners", default: "default" }
runs:
  using: composite
  steps:
    - if: inputs.hosted == 'true'
      uses: actions/setup-node@v4
      with: { node-version: 22 }
    - if: inputs.hosted == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}
        components: ${{ inputs.rust-components }}
    - if: inputs.hosted == 'true' && inputs.linux-gui == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
    - if: inputs.hosted != 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; echo /opt/homebrew/bin >> "$GITHUB_PATH"
          ROOT="$HOME/ci-runner/cache/target"
        else
          ROOT=/cache/target
        fi
        [ -z "${{ inputs.rust-targets }}" ] || rustup target add $(echo "${{ inputs.rust-targets }}" | tr , ' ')
        [ -z "${{ inputs.rust-components }}" ] || rustup component add $(echo "${{ inputs.rust-components }}" | tr , ' ')
        D="$ROOT/${GITHUB_REPOSITORY##*/}-${{ inputs.cache-key }}"; mkdir -p "$D"
        echo "CARGO_TARGET_DIR=$D" >> "$GITHUB_ENV"
        node -v; cargo -V
