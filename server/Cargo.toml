[package]
name = "housecall-server"
version = "0.4.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
openssl = "0.10"
base64 = "0.22"
httpdate = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

housecall-media = { path = "../crates/media", version = "0.1.0" }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-stream = "0.1"

webauthn-rs = "0.5.5"
housecall-activities = { path = "../crates/activities", version = "0.1.0" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }

housecall-sfu = { path = "../crates/sfu", version = "0.1.0" }

scraper = "0.29"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
tempfile = "3"

str0m = { version = "0.25", default-features = false, features = ["openssl"] }
