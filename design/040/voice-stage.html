<!doctype html>
<html lang="en" data-accent="lavender">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HC-040 · 5 Voice stage</title>
<!-- default = four people, side chat open · focus = mara's stream has the stage · alone · connecting · failed -->
<meta name="hc-states" content="default,focus,alone,connecting,failed">
<link rel="stylesheet" href="../../client/src/ui/tokens/tokens.css">
<link rel="stylesheet" href="../../client/src/ui/tokens/directions/b.css">
<link rel="stylesheet" href="../../client/src/ui/tokens/directions/c.css">
<link rel="stylesheet" href="../../client/src/ui/tokens/accents.css">
<link rel="stylesheet" href="../../client/src/ui/styles/index.css">
<link rel="stylesheet" href="hc-040.css">
<script src="icons.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div class="hc-root">
  <div class="hc-shell" data-screen="main">
    <nav class="hc-left" aria-label="Housecall" data-part="left"
      data-opts='{"current":"Lounge","me":true,"call":"connected"}'
      data-opts-alone='{"current":"Lounge","me":true,"lounge":"empty","call":"connected"}'
      data-opts-connecting='{"current":"Lounge","me":false,"call":"connecting"}'
      data-opts-failed='{"current":"Lounge","me":false,"call":"failed"}'></nav>
    <main class="hc-center">
      <header class="hc-header">
        <span class="hc-header__menu" data-show-phone="1"><button type="button" class="hc-ibtn" aria-label="Menu"><i data-i="menu"></i></button></span>
        <div class="hc-header__title">
          <span class="hc-header__glyph"><i data-i="speaker"></i></span>
          <h1>Lounge</h1>
          <!-- Phone: the stage has no call strip, so the signal sits here. -->
          <span class="hc-header__meta" data-show="default focus"><button type="button" class="hc-signal hc-tipped" data-bars="3" aria-label="Connection" data-show-phone="1"><i></i><i></i><i></i><span class="hc-tip" role="tooltip" data-side="start" data-below>32 ms to server</span></button>4 inside</span>
          <span class="hc-header__meta" data-show="alone"><button type="button" class="hc-signal hc-tipped" data-bars="3" aria-label="Connection" data-show-phone="1"><i></i><i></i><i></i><span class="hc-tip" role="tooltip" data-side="start" data-below>32 ms to server</span></button>Just you</span>
          <span class="hc-header__meta" data-show="connecting">Connecting</span>
        </div>
        <span class="hc-header__chat">
          <button type="button" class="hc-ibtn is-active" aria-label="Chat" aria-pressed="true" data-show="default"><i data-i="chat"></i></button>
          <button type="button" class="hc-ibtn" aria-label="Chat, 2 unread" data-hide="default"><i data-i="chat"></i></button>
          <span class="hc-count" aria-hidden="true" data-show="focus">2</span>
        </span>
        <!-- People only where the right column is a sheet (1100 px and below). No search, pins or server settings here. -->
        <button type="button" class="hc-ibtn" aria-label="People" data-show-phone="1"><i data-i="people"></i></button>
      </header>

      <section class="hc-stage is-full" aria-label="Call stage" data-phase="live">
        <!-- default: a grid, one tile per person -->
        <div class="hc-stage__grid" data-count="4" data-show="default">
          <figure class="hc-tile is-speaking">
            <span class="hc-tile__face"><span data-av="mara" data-size="lg"></span></span>
            <button type="button" class="hc-tile__pin" aria-pressed="false" aria-label="Focus mara"></button>
            <span class="hc-tile__hint" aria-hidden="true"><i data-i="expand"></i></span>
            <figcaption><span class="hc-tile__name">mara</span><span class="hc-livepill">LIVE</span></figcaption>
          </figure>
          <figure class="hc-tile">
            <img class="hc-tile__video" src="assets/camera.svg" alt="">
            <button type="button" class="hc-tile__pin" aria-pressed="false" aria-label="Focus june"></button>
            <span class="hc-tile__hint" aria-hidden="true"><i data-i="expand"></i></span>
            <figcaption><span class="hc-tile__name">june</span></figcaption>
          </figure>
          <figure class="hc-tile">
            <span class="hc-tile__face"><span data-av="felix" data-size="lg"></span></span>
            <button type="button" class="hc-tile__pin" aria-pressed="false" aria-label="Focus felix"></button>
            <span class="hc-tile__hint" aria-hidden="true"><i data-i="expand"></i></span>
            <figcaption><span class="hc-tile__name">felix</span><span class="hc-tile__state" role="img" aria-label="Muted"><i data-i="mic" data-off></i></span></figcaption>
          </figure>
          <figure class="hc-tile">
            <span class="hc-tile__face"><span data-av="theo" data-size="lg"></span></span>
            <button type="button" class="hc-tile__pin" aria-pressed="false" aria-label="Focus theo"></button>
            <span class="hc-tile__hint" aria-hidden="true"><i data-i="expand"></i></span>
            <figcaption><span class="hc-tile__name">theo <small>(you)</small></span></figcaption>
          </figure>
        </div>

        <!-- focus: one stream has the stage, everyone else in a strip -->
        <div class="hc-stage__spot" data-show="focus">
          <figure class="hc-tile hc-tile--stream">
            <img class="hc-tile__video" src="assets/stream.svg" alt="">
            <button type="button" class="hc-tile__pin" aria-pressed="true" aria-label="Stop focusing mara's screen"></button>
            <figcaption><span class="hc-tile__name">mara's screen</span><span class="hc-livepill">LIVE</span></figcaption>
          </figure>
        </div>
        <div class="hc-stage__strip" data-show="focus">
          <figure class="hc-tile is-speaking"><span class="hc-tile__face"><span data-av="mara" data-size="lg"></span></span><figcaption><span class="hc-tile__name">mara</span></figcaption></figure>
          <figure class="hc-tile"><img class="hc-tile__video" src="assets/camera.svg" alt=""><figcaption><span class="hc-tile__name">june</span></figcaption></figure>
          <figure class="hc-tile"><span class="hc-tile__face"><span data-av="felix" data-size="lg"></span></span><figcaption><span class="hc-tile__name">felix</span><span class="hc-tile__state"><i data-i="mic" data-off></i></span></figcaption></figure>
          <figure class="hc-tile"><span class="hc-tile__face"><span data-av="theo" data-size="lg"></span></span><figcaption><span class="hc-tile__name">theo</span></figcaption></figure>
        </div>

        <!-- alone -->
        <div class="hc-stage__alone" data-show="alone">
          <figure class="hc-tile">
            <span class="hc-tile__face"><span data-av="theo" data-size="lg"></span></span>
            <figcaption><span class="hc-tile__name">theo <small>(you)</small></span></figcaption>
          </figure>
          <p><strong>Just you so far</strong>Everyone in Theo's place can see you're in here and walk in.</p>
        </div>

        <!-- connecting: the tiles that are about to exist, breathing -->
        <div class="hc-stage__grid" data-count="2" data-show="connecting" aria-busy="true">
          <div class="hc-tile hc-skel"></div><div class="hc-tile hc-skel"></div>
        </div>

        <!-- failed -->
        <div class="hc-empty" data-show="failed" role="alert">
          <svg class="hc-empty__door" viewBox="0 0 24 30" aria-hidden="true"><path class="hc-door__frame" d="M1 30V12a11 11 0 0 1 22 0v18Z"/><path class="hc-door__shut" d="M4.5 30V12a7.5 7.5 0 0 1 15 0v18Z"/><path class="hc-door__knob" d="M15.5 19.5v1.4"/></svg>
          <strong>Couldn't join Lounge</strong>
          <p>The call server didn't answer. Check your connection and try again.</p>
          <button type="button" class="hc-btn hc-btn--primary">Try again</button>
        </div>

        <div class="hc-stagebar" role="toolbar" aria-label="Call" data-hide="failed">
          <button type="button" class="hc-ibtn" aria-label="Mute"><i data-i="mic"></i></button>
          <button type="button" class="hc-ibtn" aria-label="Deafen"><i data-i="headphones"></i></button>
          <button type="button" class="hc-ibtn" aria-label="Camera on"><i data-i="camera" data-off></i></button>
          <button type="button" class="hc-ibtn" aria-label="Share screen" data-show-phone="0"><i data-i="screen"></i></button>
          <button type="button" class="hc-ibtn hc-stagebar__leave" aria-label="Leave"><i data-i="leave"></i></button>
        </div>
      </section>
    </main>
    <aside class="hc-right" aria-label="Details" data-part="right" data-tab="chat" data-opts='{"chat":true}' data-opts-alone='{"chat":true}'></aside>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Every state but the default shows People in the right column, to show the tab row with Chat present.
    if (HC.state && HC.state !== "default") { const side = document.querySelector(".hc-right"); side.innerHTML = HC.right("people", { chat: true }); }
    if (HC.state === "connecting") document.querySelectorAll(".hc-stagebar .hc-ibtn:not(.hc-stagebar__leave)").forEach(b => b.disabled = true);
  });
</script>
</body>
</html>
